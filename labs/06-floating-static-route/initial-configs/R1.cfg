hostname R1
no ip domain-lookup
!
interface GigabitEthernet0/0
 ip address 10.0.12.1 255.255.255.252
 no shutdown
interface GigabitEthernet0/1
 ip address 10.0.13.1 255.255.255.252
 no shutdown
interface Loopback0
 ip address 192.0.2.1 255.255.255.255
ip route 198.51.100.1 255.255.255.255 10.0.12.2 200
ip route 198.51.100.1 255.255.255.255 10.0.13.2 10
!
end
