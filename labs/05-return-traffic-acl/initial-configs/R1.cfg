hostname R1
no ip domain-lookup
!
interface GigabitEthernet0/0
 ip address 10.0.12.1 255.255.255.252
 ip access-group FROM-SERVER in
 no shutdown
interface Loopback0
 ip address 192.0.2.1 255.255.255.255
ip route 198.51.100.1 255.255.255.255 10.0.12.2
ip access-list extended FROM-SERVER
 10 permit ospf any any
 20 permit icmp host 198.51.100.1 host 192.0.2.1 echo
 90 deny ip any any log
!
end
